<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          if (nativeFetch) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return nativeFetch;
              },
              set: function () {
                // Keep native fetch intact while preventing extension TypeError
              },
            });
          }
        } catch (e) {
          // Ignore if descriptor is locked
        }

        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var src = String((event && event.filename) || '');
            if (
              src.indexOf('chrome-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <title>하오찬 (Haochan) - 프리미엄 중식 다이닝 & 테이블 예약</title>
